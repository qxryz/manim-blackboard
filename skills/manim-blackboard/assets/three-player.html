<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Blackboard</title>
  <style>
    :root { color-scheme: dark; background: #000; color: #f4efe6; font-family: var(--bb-font); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    #stage {
      min-height: 100dvh; padding-block-start: max(0px, (100dvh - 56.25vw) / 2); display: grid; justify-items: center; align-items: start;
      background: #000; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    #board {
      width: min(100vw, 177.778dvh); height: min(100dvh, 56.25vw);
      display: grid; grid-template-rows: minmax(0,1fr) 21%; container-type: inline-size;
    }
    #scene {
      display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,.85fr);
      padding: 1.2% 4% 0 2%; min-height: 0;
    }
    #visual { position: relative; min-width: 0; min-height: 0; }
    #visual canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #visual canvas:active { cursor: grabbing; }
    #annotation {
      min-width: 0; align-self: start; padding-top: min(16dvh, 9rem); container-type: inline-size;
      padding-inline: 0 1%;
    }
    #subtitles {
      align-self: start; justify-self: center; width: 90%; padding-bottom: 1%;
      text-align: center; font-size: clamp(16px,2.1cqw,34px); line-height: 1.35; text-wrap: balance;
    }
    #subtitles p { margin: 0; }
    #subtitles[data-dual="true"] { font-size: clamp(15px,1.72cqw,28px); }
    #secondary { color: #d1ccc4; padding-top: .18em; }
    [lang|="zh"] { font-family: var(--bb-font-zh); }
    #render-message {
      position: absolute; inset: 0; place-content: center; margin: 0; padding: 1em;
      text-align: center; font-size: clamp(16px,2cqw,28px); line-height: 1.4;
    }
    #render-message:not([hidden]) { display: grid; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    [hidden] { display: none !important; }
    @media (orientation: landscape) and (max-height: 500px) {
      #stage { padding: 0; }
      #annotation { padding-top: 4dvh; }
      #board { width: 100vw; height: 100dvh; grid-template-rows: minmax(0,1fr) max(23%,4.7rem); }
      #scene { padding-top: 0; }
      #subtitles, #subtitles[data-dual="true"] { font-size: clamp(15px,1.9vw,20px); width: 96%; line-height: 1.2; }
    }
    @media (orientation: portrait) {
      #stage { padding-block-start: max(0px, (100dvh - 210vw) / 2); }
      #board { width: 100vw; height: min(100dvh,210vw); grid-template-rows: minmax(0,1fr) max(17%,6.5rem); }
      #scene { padding: 0 5%; grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; }
      #annotation { width: 100%; padding: 0; }
      #subtitles, #subtitles[data-dual="true"] { font-size: clamp(15px,4.2vw,25px); width: 93%; line-height: 1.28; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-describedby="controls-help">
    <div id="board">
      <div id="scene">
        <div id="visual">
          <canvas role="img" aria-describedby="primary"></canvas>
          <p id="render-message" role="status" hidden></p>
        </div>
        <div id="annotation"></div>
      </div>
      <div id="subtitles" aria-live="polite" aria-atomic="true">
        <p id="primary"></p>
        <p id="secondary" hidden></p>
      </div>
    </div>
    <p id="controls-help" class="sr-only" lang="en">Drag the drawing to rotate it. Click or press Space to advance. Left Arrow goes back, R replays F opens full screen and T chooses a typeface.<span id="language-help" hidden> Press L or hold a touch to toggle the translation.</span></p>
    <noscript>Enable JavaScript to view this interactive lesson.</noscript>
  </main>
  <!--BLACKBOARD_CAPTION_TRACK-->
  <!--BLACKBOARD_TYPE-->
  <!--THREE_PLAYER_BUNDLE-->
</body>
</html>
